[project]
name = "legacy-to-ai-modernization-backend"
version = "0.1.0"
description = "Antigravity Legacy to AI-Native Modernization Hub - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.0",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
