[project]
name = "adk-realtime-intelligence"
version = "0.1.0"
description = "Real-time Multi-Tool Agent built with Google Agent Development Kit (ADK)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.1.0",
    "google-genai>=1.0.0",
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
