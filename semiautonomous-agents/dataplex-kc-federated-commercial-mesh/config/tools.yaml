# ============================================================================
# Google MCP Toolbox for Databases (genai-toolbox) Configuration
# Enterprise Federated Commercial Intelligence Mesh
# ============================================================================
sources:
  enterprise-commercial-bq:
    kind: bigquery
    project: ${GCP_PROJECT_ID:enterprise-commercial-mesh-prod}
    location: US

tools:
  get_stalled_stage_opportunities:
    kind: bigquery-sql
    source: enterprise-commercial-bq
    description: >-
      Fetch active pipeline opportunities stalled in a specified stage (e.g.,
      Stage 3 - Solutioning) for more than min_days, ordered by TCV descending.
      Backed by v_gold_opportunity_spine in CRM_Opportunity_Spine.
    parameters:
      - name: stage_prefix
        type: string
        description: Pipeline stage filter prefix (e.g., 'Stage 3').
      - name: min_days
        type: integer
        description: Minimum days stalled in current stage (default 90).
    statement: |
      SELECT
        opp_id,
        account_id,
        account_name,
        region,
        industry,
        service_line,
        stage_name,
        ROUND(tcv_usd / 1e6, 2) AS tcv_millions,
        ROUND(acv_usd / 1e6, 2) AS acv_millions,
        stage_age_days,
        ROUND(win_prob * 100, 1) AS win_prob_pct,
        deal_owner,
        markov_regime
      FROM `enterprise_commercial_gold.v_gold_opportunity_spine`
      WHERE stage_name LIKE CONCAT(@stage_prefix, '%')
        AND stage_age_days >= @min_days
      ORDER BY tcv_usd DESC;

  get_regional_win_rate_trends:
    kind: bigquery-sql
    source: enterprise-commercial-bq
    description: >-
      Aggregate total pipeline TCV, weighted bookings, average win probability,
      and average Adjusted Yield v4 across geographic regions.
    parameters:
      - name: min_win_prob
        type: float
        description: Optional minimum win probability filter (0.0 to 1.0).
    statement: |
      SELECT
        region,
        COUNT(opp_id) AS active_deal_count,
        ROUND(SUM(tcv_usd) / 1e6, 2) AS total_tcv_millions,
        ROUND(SUM(tcv_usd * win_prob) / 1e6, 2) AS weighted_bookings_millions,
        ROUND(AVG(win_prob) * 100, 1) AS avg_win_prob_pct,
        ROUND(AVG(adjusted_yield_v4) * 100, 1) AS avg_adjusted_yield_v4_pct
      FROM `enterprise_commercial_gold.v_gold_opportunity_spine`
      WHERE win_prob >= @min_win_prob
      GROUP BY region
      ORDER BY total_tcv_millions DESC;

  get_top_tcv_deals_by_region:
    kind: bigquery-sql
    source: enterprise-commercial-bq
    description: >-
      Return the top N highest-TCV active opportunities filtered by region
      (or 'ALL' for global ranking) with gross margin and Adjusted Yield v4.
    parameters:
      - name: region_filter
        type: string
        description: Geographic region name or 'ALL'.
      - name: limit_n
        type: integer
        description: Number of top deals to return (default 10).
    statement: |
      SELECT
        opp_id,
        account_name,
        region,
        industry,
        stage_name,
        ROUND(tcv_usd / 1e6, 2) AS tcv_millions,
        ROUND(gross_margin_pct * 100, 1) AS gross_margin_pct,
        ROUND(adjusted_yield_v4 * 100, 1) AS adjusted_yield_v4_pct,
        deal_owner
      FROM `enterprise_commercial_gold.v_gold_opportunity_spine`
      WHERE (@region_filter = 'ALL' OR region = @region_filter)
      ORDER BY tcv_usd DESC
      LIMIT @limit_n;

  get_account_360_composite_health:
    kind: bigquery-sql
    source: enterprise-commercial-bq
    description: >-
      Retrieve unified pre-sales commercial pricing yield (Deal_Pricing_Engine)
      joined with post-sales delivery SLA health and EAC margin variance
      (Delivery_Governance_Hub & ERP_Financials_Ledger).
    parameters:
      - name: rag_filter
        type: string
        description: Filter by delivery RAG status ('RED', 'AMBER', 'GREEN', or 'ALL').
    statement: |
      SELECT
        account_id,
        account_name,
        opp_id,
        stage_name,
        ROUND(tcv_usd / 1e6, 2) AS tcv_millions,
        rag_status,
        milestone_delays,
        sla_slippage_days,
        ROUND(sold_adjusted_yield_v4 * 100, 1) AS sold_yield_v4_pct,
        ROUND(eac_margin_variance_pct * 100, 1) AS eac_margin_variance_pct,
        csat_score,
        delivery_commentary
      FROM `enterprise_commercial_gold.v_gold_account_360_health`
      WHERE (@rag_filter = 'ALL' OR rag_status = @rag_filter)
      ORDER BY eac_margin_variance_pct ASC;

  simulate_portfolio_margin_cull:
    kind: bigquery-sql
    source: enterprise-commercial-bq
    description: >-
      Counterfactual baseline query over v_gold_adjusted_yield_dax to evaluate
      the blended portfolio margin uplift of exiting or repricing the bottom
      cull_percentile (e.g. 0.20) of deals ranked by Adjusted Yield v4.
    parameters:
      - name: cull_percentile
        type: float
        description: Bottom percentile threshold to exit/reprice (e.g., 0.20 for bottom 20%).
    statement: |
      WITH ranked_portfolio AS (
        SELECT
          opp_id,
          account_name,
          tcv_usd,
          net_service_rev_usd,
          adjusted_yield_v4_sigma_capped AS adj_yield_v4,
          PERCENT_RANK() OVER (ORDER BY adjusted_yield_v4_sigma_capped ASC) AS yield_pct_rank
        FROM `enterprise_commercial_gold.v_gold_adjusted_yield_dax`
      )
      SELECT
        ROUND(AVG(adj_yield_v4) * 100, 2) AS baseline_blended_yield_pct,
        ROUND(AVG(IF(yield_pct_rank >= @cull_percentile, adj_yield_v4, NULL)) * 100, 2) AS post_cull_blended_yield_pct,
        ROUND((AVG(IF(yield_pct_rank >= @cull_percentile, adj_yield_v4, NULL)) - AVG(adj_yield_v4)) * 10000, 0) AS margin_uplift_bps,
        ROUND(SUM(IF(yield_pct_rank < @cull_percentile, tcv_usd, 0)) / 1e6, 2) AS pruned_tcv_millions,
        ROUND(SUM(IF(yield_pct_rank >= @cull_percentile, tcv_usd, 0)) / 1e6, 2) AS retained_tcv_millions
      FROM ranked_portfolio;

  get_deal_win_lever_elasticity:
    kind: bigquery-sql
    source: enterprise-commercial-bq
    description: >-
      Retrieve 6-lever commercial win-probability drivers (Price Competitiveness,
      Sponsor Alignment, Delivery CSAT, Stage Velocity, Discount Giveaway) and
      compute logit win-rate sensitivity.
    parameters:
      - name: opp_id_filter
        type: string
        description: Specific opportunity ID or 'ALL'.
    statement: |
      SELECT
        o.opp_id,
        o.account_name,
        o.stage_name,
        ROUND(o.tcv_usd / 1e6, 2) AS tcv_millions,
        ROUND(o.win_prob * 100, 1) AS baseline_win_prob_pct,
        ROUND(o.client_Temp_score * 100, 1) AS executive_sponsor_score,
        ROUND(p.price_competitiveness_score * 100, 1) AS price_competitiveness_score,
        ROUND(p.discount_giveaway_pct * 100, 1) AS discount_giveaway_pct,
        ROUND(LEAST(0.96, o.win_prob + 0.085 * (1.0 - o.win_prob)) * 100, 1) AS simulated_win_prob_plus10_price_pct
      FROM `enterprise_commercial_gold.v_gold_opportunity_spine` o
      JOIN `enterprise_commercial_gold.v_gold_adjusted_yield_dax` p
        ON o.opp_id = p.opp_id
      WHERE (@opp_id_filter = 'ALL' OR o.opp_id = @opp_id_filter)
      ORDER BY o.tcv_usd DESC;

  get_stale_owner_opportunities:
    kind: bigquery-sql
    source: enterprise-commercial-bq
    description: >-
      Identify pipeline hygiene violations where opportunities have had zero
      deal-owner CRM activity for at least inactive_days_threshold days.
    parameters:
      - name: inactive_days_threshold
        type: integer
        description: Minimum days without owner activity (default 14).
    statement: |
      SELECT
        opp_id,
        account_name,
        region,
        stage_name,
        deal_owner,
        last_owner_activity_date,
        DATE_DIFF(CURRENT_DATE(), DATE(last_owner_activity_date), DAY) AS inactive_days,
        ROUND(tcv_usd / 1e6, 2) AS tcv_millions
      FROM `enterprise_commercial_gold.v_gold_opportunity_spine`
      WHERE DATE_DIFF(CURRENT_DATE(), DATE(last_owner_activity_date), DAY) >= @inactive_days_threshold
      ORDER BY inactive_days DESC, tcv_usd DESC;

  check_source_genai_compliance:
    kind: bigquery-sql
    source: enterprise-commercial-bq
    description: >-
      Pre-flight Dataplex Knowledge Catalog Governance Guard. Verifies whether
      a requested data source carries GenAI_Usage_Rights = True before allowing
      any rows or snippets to enter an LLM prompt or RAG context window.
    parameters:
      - name: source_name
        type: string
        description: Canonical source name registered in Dataplex Governance catalog.
    statement: |
      SELECT
        source_id,
        source_name,
        category,
        storage_engine,
        genai_usage_rights,
        pii_classification,
        dataplex_aspect_uri,
        steward_team,
        notes
      FROM `enterprise_commercial_gold.data_source_governance`
      WHERE source_name = @source_name;

toolsets:
  commercial_mesh_core_toolset:
    - get_stalled_stage_opportunities
    - get_regional_win_rate_trends
    - get_top_tcv_deals_by_region
    - get_account_360_composite_health
    - simulate_portfolio_margin_cull
    - get_deal_win_lever_elasticity
    - get_stale_owner_opportunities
    - check_source_genai_compliance
