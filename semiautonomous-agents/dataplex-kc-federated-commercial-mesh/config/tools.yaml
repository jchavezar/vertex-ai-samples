# ============================================================================
# Google MCP Toolbox for Databases (genai-toolbox) Configuration
# Dataset: `vtxdemos.commercial_mesh_gold` (Location: US)
# Enterprise Federated Commercial Intelligence Mesh
# ============================================================================
sources:
  vtxdemos-commercial-bq:
    kind: bigquery
    project: ${GCP_PROJECT_ID:vtxdemos}
    location: US

tools:
  get_stage2b_stalled_deals:
    kind: bigquery-sql
    source: vtxdemos-commercial-bq
    description: >-
      Fetch active pipeline opportunities in Stage 2B - Solutioning stalled for
      more than min_days, ordered by TCV descending. Backed by
      vtxdemos.commercial_mesh_gold.v_gold_stage2b_stalled_deals.
    parameters:
      - name: min_days
        type: integer
        description: Minimum days stalled in Stage 2B - Solutioning (default 90).
    statement: |
      SELECT
        opp_id,
        account_id,
        account_name,
        region,
        industry,
        service_line,
        stage_code,
        days_at_current_stage,
        days_since_last_activity,
        tcv_millions,
        acv_millions,
        ROUND(win_probability * 100, 1) AS win_prob_pct,
        markov_regime,
        primary_competitor,
        ROUND(cci_excluding_be_pct * 100, 1) AS cci_excl_be_pct,
        ROUND(adjusted_yield_v4_sigma_capped * 100, 1) AS adjusted_yield_v4_pct
      FROM `vtxdemos.commercial_mesh_gold.v_gold_stage2b_stalled_deals`
      WHERE days_at_current_stage > @min_days
      ORDER BY tcv_millions DESC;

  get_regional_win_rate_trends:
    kind: bigquery-sql
    source: vtxdemos-commercial-bq
    description: >-
      Compute 8-quarter regional win rates, total TCV, weighted bookings,
      and average Adjusted Yield v4 across NA, EMEA, APAC, and LATAM.
    parameters:
      - name: region_filter
        type: string
        description: Geographic region ('NA', 'EMEA', 'APAC', 'LATAM', or 'ALL').
    statement: |
      SELECT
        region,
        fiscal_quarter,
        COUNT(opp_id) AS deal_count,
        ROUND(SUM(tcv_usd) / 1e6, 2) AS total_tcv_millions,
        ROUND(AVG(win_probability) * 100, 1) AS avg_win_prob_pct,
        ROUND(
          SAFE_DIVIDE(
            COUNTIF(stage_code = 'Closed Won'),
            NULLIF(COUNTIF(stage_code IN ('Closed Won', 'Closed Lost')), 0)
          ) * 100,
          1
        ) AS closed_win_rate_pct
      FROM `vtxdemos.commercial_mesh_gold.crm_opportunities`
      WHERE (@region_filter = 'ALL' OR region = @region_filter)
      GROUP BY region, fiscal_quarter
      ORDER BY region, fiscal_quarter;

  get_pricing_yield_dax_metrics:
    kind: bigquery-sql
    source: vtxdemos-commercial-bq
    description: >-
      Query canonical DAX pricing metrics from v_gold_pricing_yield_dax including
      CCI excluding billable expenses, Adjusted Yield v1/v3/v4, ADR ($), and
      AMS AI task substitutability %.
    parameters:
      - name: service_line_filter
        type: string
        description: Service line filter or 'ALL'.
    statement: |
      SELECT
        opp_id,
        account_name,
        region,
        service_line,
        pricing_construct,
        ROUND(tcv_usd / 1e6, 2) AS tcv_millions,
        ROUND(cci_including_be_pct * 100, 2) AS cci_incl_be_pct,
        ROUND(cci_excluding_be_pct * 100, 2) AS cci_excl_be_pct,
        ROUND(adr_usd, 0) AS adr_usd,
        ROUND(adjusted_yield_v3_trimmed * 100, 2) AS adj_yield_v3_pct,
        ROUND(adjusted_yield_v4_sigma_capped * 100, 2) AS adj_yield_v4_pct,
        ROUND(ams_ai_task_substitutable_pct * 100, 1) AS ai_substitutable_pct
      FROM `vtxdemos.commercial_mesh_gold.v_gold_pricing_yield_dax`
      WHERE (@service_line_filter = 'ALL' OR service_line = @service_line_filter)
      ORDER BY tcv_usd DESC
      LIMIT 25;

  get_markov_regime_analytics:
    kind: bigquery-sql
    source: vtxdemos-commercial-bq
    description: >-
      Retrieve Hidden Markov Commercial Regime distribution, average duration days,
      and 6-lever PWin drivers from v_gold_markov_regime_analytics.
    parameters:
      - name: regime_filter
        type: string
        description: Markov regime ('Expansion_Velocity', 'Pressured_Margin', 'Stalled_Procurement', or 'ALL').
    statement: |
      SELECT
        markov_regime,
        COUNT(opp_id) AS deal_count,
        ROUND(SUM(tcv_usd) / 1e6, 2) AS total_tcv_millions,
        ROUND(AVG(regime_duration_days), 1) AS avg_regime_days,
        ROUND(AVG(win_probability) * 100, 1) AS avg_win_prob_pct,
        ROUND(AVG(cci_excluding_be_pct) * 100, 2) AS avg_cci_excl_be_pct,
        ROUND(AVG(adjusted_yield_v4_sigma_capped) * 100, 2) AS avg_adj_yield_v4_pct
      FROM `vtxdemos.commercial_mesh_gold.v_gold_markov_regime_analytics`
      WHERE (@regime_filter = 'ALL' OR markov_regime = @regime_filter)
      GROUP BY markov_regime
      ORDER BY total_tcv_millions DESC;

  get_account_360_health:
    kind: bigquery-sql
    source: vtxdemos-commercial-bq
    description: >-
      Retrieve unified pre-sales commercial pricing yield joined with post-sales
      delivery RAG status, EAC margin variance (bps), and external market signals.
    parameters:
      - name: rag_filter
        type: string
        description: Delivery RAG status ('RED', 'AMBER', 'GREEN', or 'ALL').
    statement: |
      SELECT
        account_id,
        account_name,
        region,
        industry,
        rag_status,
        csat_score,
        nps_score,
        sla_slippage_days,
        eac_margin_variance_bps,
        open_staffing_roles,
        total_pipeline_tcv_millions,
        avg_cci_excl_be_pct,
        avg_adjusted_yield_v4_pct,
        ai_self_sufficiency_index,
        buyer_intent_surge_score,
        unstructured_director_review_notes
      FROM `vtxdemos.commercial_mesh_gold.v_gold_account_360_health`
      WHERE (@rag_filter = 'ALL' OR rag_status = @rag_filter)
      ORDER BY eac_margin_variance_bps ASC
      LIMIT 25;

  check_source_genai_compliance:
    kind: bigquery-sql
    source: vtxdemos-commercial-bq
    description: >-
      Pre-flight Dataplex Knowledge Catalog Governance Guard. Verifies whether
      a requested data source carries genai_usage_rights = TRUE before allowing
      any rows or snippets to enter an LLM prompt or RAG context window.
    parameters:
      - name: source_name
        type: string
        description: Canonical source name registered in dataplex_source_governance.
    statement: |
      SELECT
        source_id,
        source_name,
        category,
        genai_usage_rights,
        pii_classification,
        dataplex_aspect_uri,
        steward_team,
        governance_notes
      FROM `vtxdemos.commercial_mesh_gold.dataplex_source_governance`
      WHERE source_name = @source_name;

  # --------------------------------------------------------------------------
  # Dynamic Built-in BigQuery MCP Tools (Solves the "Fixed SQL" Limitation
  # for Unscripted Econometric / Statistical Queries over Certified Gold Views)
  # --------------------------------------------------------------------------
  execute_sql:
    kind: bigquery-execute-sql
    source: vtxdemos-commercial-bq
    description: >-
      Execute any read-only BigQuery Standard SQL or econometric query
      (CORR, COVAR_SAMP, VAR_SAMP, APPROX_QUANTILES, PERCENTILE_CONT)
      preferentially targeting certified Gold Views in vtxdemos.commercial_mesh_gold
      (v_gold_pricing_yield_dax, v_gold_stage2b_stalled_deals,
      v_gold_markov_regime_analytics, v_gold_account_360_health).

  get_table_info:
    kind: bigquery-get-table-info
    source: vtxdemos-commercial-bq
    description: >-
      Retrieve column schema and metadata for any table or Gold View in
      vtxdemos.commercial_mesh_gold before writing custom SQL.

  list_table_ids:
    kind: bigquery-list-table-ids
    source: vtxdemos-commercial-bq
    description: >-
      List all tables and certified Gold Views in vtxdemos.commercial_mesh_gold.

  ask_data_insights:
    kind: bigquery-conversational-analytics
    source: vtxdemos-commercial-bq
    description: >-
      Run BigQuery Conversational Analytics (Gemini Data Analytics) over
      specified tables or Gold Views in vtxdemos.commercial_mesh_gold.

  forecast:
    kind: bigquery-forecast
    source: vtxdemos-commercial-bq
    description: >-
      Forecast time-series metrics in vtxdemos.commercial_mesh_gold using
      BigQuery built-in AI.FORECAST (TimesFM).

toolsets:
  commercial_mesh_core_toolset:
    - get_stage2b_stalled_deals
    - get_regional_win_rate_trends
    - get_pricing_yield_dax_metrics
    - get_markov_regime_analytics
    - get_account_360_health
    - check_source_genai_compliance
    - execute_sql
    - get_table_info
    - list_table_ids
    - ask_data_insights
    - forecast
