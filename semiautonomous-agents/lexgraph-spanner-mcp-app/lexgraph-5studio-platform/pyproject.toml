[project]
name = "mike-gcp-platform"
version = "0.1.0"
description = "Scalable Enterprise Legal AI Platform on Google Cloud Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "google-auth>=2.30.0",
    "google-cloud-spanner>=3.45.0",
    "google-cloud-logging>=3.11.0",
    "google-genai>=0.1.1",
    "requests>=2.31.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "app.py",
    "telemetry.py",
    "spanner_engine.py",
    "agent_engine.py",
    "adk_agents.py",
    "demo_data.py",
    "ui_template.py",
    "generate_scaled_corpus.py",
    "generate_multimodal_corpus.py",
    "multimodal_extraction_pipeline.py",
    "ingest_and_benchmark.py"
]
