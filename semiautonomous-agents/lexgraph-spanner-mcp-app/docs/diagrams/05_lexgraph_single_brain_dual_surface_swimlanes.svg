  <text x="1388" y="52" fill="#38BDF8" font-size="11.5" font-weight="700" text-anchor="middle">GE Luminous v23.0.0 + SEP-1865</text>
  <text x="1388" y="68" fill="#34D399" font-size="10.5" font-weight="700" text-anchor="middle">100% Shared Backend &amp; Playbook</text>

