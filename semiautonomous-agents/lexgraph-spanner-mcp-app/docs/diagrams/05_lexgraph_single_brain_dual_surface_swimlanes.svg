  <text x="279" y="876" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Verified in Headless Chrome Across Both Light &amp; Dark Modes</text>

  <!-- Stage 5B: Architectural Decision Matrix -->
  <rect x="544" y="692" width="470" height="206" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="558" y="704" width="250" height="18" rx="4" fill="#D97706"/>
  <text x="683" y="717" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 5B · WHEN TO USE WHICH SURFACE</text>
  <text x="558" y="740" fill="#92400E" font-size="13.5" font-weight="800">Golden Rule for LexGraph Customer Deployment</text>
  <text x="558" y="760" fill="#78350F" font-size="11.2" font-weight="700">1. Use Gemini Enterprise Web Canvas (Surface 1) when:</text>
  <text x="558" y="777" fill="#78350F" font-size="10.8">   Reviewing 46 deal contracts, applying Playbook redlines, or</text>
  <text x="558" y="793" fill="#78350F" font-size="10.8">   assembling modular Privacy Pro / Tax Legal Legos riders.</text>
  <text x="558" y="813" fill="#78350F" font-size="11.2" font-weight="700">2. Use Word Add-In / Native GDocs (Surface 2) when:</text>
  <text x="558" y="830" fill="#78350F" font-size="10.8">   Doing heavy freeform manual typing across multi-page sections.</text>
  <rect x="558" y="860" width="442" height="24" rx="4" fill="#FEF3C7"/>
  <text x="779" y="876" fill="#92400E" font-size="10" font-weight="700" text-anchor="middle">Both Surfaces Call the Exact Same Cloud Run Endpoints</text>

