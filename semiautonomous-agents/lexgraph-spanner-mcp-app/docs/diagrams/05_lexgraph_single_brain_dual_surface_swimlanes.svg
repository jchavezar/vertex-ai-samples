  <!-- ==================== SWIMLANE 2: STAGES 3 & 4 (SURGICAL AST MUTATION FOR .DOCX VS GOOGLE DOCS) ==================== -->
  <rect x="24" y="370" width="1512" height="256" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="24" y="370" width="1512" height="32" rx="10" fill="#1E3A8A"/>
  <text x="44" y="391" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.6">SWIMLANE 2 — STAGE 3 &amp; STAGE 4: FORMAT-LOCKED SURGICAL AST MUTATION (.DOCX OPENXML VS. GOOGLE DOCS API)</text>

  <!-- Stage 3: .docx Surgical Mutation -->
  <rect x="44" y="416" width="726" height="194" rx="8" fill="#EFF6FF" stroke="#1A73E8" stroke-width="2"/>
  <rect x="58" y="428" width="290" height="18" rx="4" fill="#1A73E8"/>
  <text x="203" y="441" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 3 · IF OPENED AS MICROSOFT WORD (.DOCX)</text>
  <text x="58" y="464" fill="#174EA6" font-size="14" font-weight="800">Surgical OpenXML Node Replacement (word/document.xml Only)</text>
  <text x="58" y="484" fill="#1E293B" font-size="11.2">1. Keeps original .docx ZIP container: word/styles.xml, word/numbering.xml, headers/footers untouched</text>
  <text x="58" y="502" fill="#1E293B" font-size="11.2">2. In Web Canvas (Studio 2): Python lxml mutates target &lt;w:p&gt;, wrapping old text in &lt;w:del&gt; and new</text>
  <text x="58" y="519" fill="#1E293B" font-size="11.2">   Playbook text in &lt;w:ins w:author="Gemini Legal AI" w:date="2026-10-16T19:40:00Z"&gt;</text>
  <text x="58" y="537" fill="#1E293B" font-size="11.2">3. In Word Add-In (Office.js): Calls targetParagraph.insertOoxml() with ChangeTrackingMode.trackAll</text>
  <rect x="58" y="550" width="698" height="46" rx="6" fill="#0F172A"/>
  <text x="72" y="569" fill="#86EFAC" font-size="10.5" font-weight="700" font-family="monospace">SHA-256 Check: styles.xml = 9f8e2b1c (UNCHANGED) | numbering.xml = 3c7a1104 (UNCHANGED)</text>
  <text x="72" y="586" fill="#38BDF8" font-size="10.5" font-weight="700" font-family="monospace">Result: 9-Level Outline (Article VIII -&gt; Section 8.02 -&gt; (a) -&gt; (i)) &amp; Cross-Refs 100% Intact</text>

  <!-- Stage 4: Google Docs Surgical Mutation -->
  <rect x="790" y="416" width="726" height="194" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <rect x="804" y="428" width="290" height="18" rx="4" fill="#059669"/>
  <text x="949" y="441" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 4 · IF OPENED AS NATIVE GOOGLE DOC</text>
  <text x="804" y="464" fill="#065F46" font-size="14" font-weight="800">Surgical Range Update (docs.documents.batchUpdate REST API)</text>
  <text x="804" y="484" fill="#1E293B" font-size="11.2">1. Reads live document structural JSON (body.content[].paragraph.elements[].startIndex..endIndex)</text>
  <text x="804" y="502" fill="#1E293B" font-size="11.2">2. Executes atomic batchUpdate: deleteContentRange + insertText strictly inside the inner text run</text>
  <text x="804" y="519" fill="#1E293B" font-size="11.2">   (excluding the trailing '\n' newline so paragraph-level NamedStyles &amp; list bullets never reset)</text>
  <text x="804" y="537" fill="#1E293B" font-size="11.2">3. Binds NamedRange (lexgraph_clause_8_02_a) &amp; writeControl.requiredRevisionId for audit traceability</text>
  <rect x="804" y="550" width="698" height="46" rx="6" fill="#0F172A"/>
  <text x="818" y="569" fill="#86EFAC" font-size="10.5" font-weight="700" font-family="monospace">Preserved Properties: namedStyleType="NORMAL_TEXT" | listId="kix.lexgraph9level" | nestingLevel=1</text>
  <text x="818" y="586" fill="#38BDF8" font-size="10.5" font-weight="700" font-family="monospace">Result: 36pt Hanging Indents, EB Garamond Typography &amp; Native Version History 100% Intact</text>

