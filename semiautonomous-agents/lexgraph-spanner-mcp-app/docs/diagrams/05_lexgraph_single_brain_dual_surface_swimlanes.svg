  <rect x="24" y="110" width="1512" height="240" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="24" y="110" width="1512" height="32" rx="10" fill="#1E293B"/>
  <text x="44" y="131" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.6">SWIMLANE 1 — STAGE 1: DUAL-SURFACE CO-EDITING ENTRYPOINT &amp; STAGE 2: CLOUD SPANNER GRAPHRAG PLAYBOOK RETRIEVAL</text>

  <!-- Stage 1A: Surface 1 (Web Canvas) -->
  <rect x="44" y="156" width="460" height="176" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="58" y="168" width="234" height="18" rx="4" fill="#2563EB"/>
  <text x="175" y="181" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 1A · SURFACE 1 (80% OF WORKFLOWS)</text>
  <text x="58" y="204" fill="#1E3A8A" font-size="13.5" font-weight="800">Gemini Enterprise Web Canvas (Studio 2 MCP App)</text>
  <text x="58" y="224" fill="#1E40AF" font-size="11.2">• Best for: Multi-doc triage, Playbook redline cards, Legal Legos</text>
  <text x="58" y="242" fill="#1E40AF" font-size="11.2">• Maximized Co-Editor (#docx-modal-overlay) shows Print-Layout</text>
