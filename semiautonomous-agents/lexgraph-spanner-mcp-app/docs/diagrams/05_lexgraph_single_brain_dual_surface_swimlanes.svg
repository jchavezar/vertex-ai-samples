  <text x="58" y="778" fill="#334155" font-size="11.2">• "Inspect Format-Lock Proof" drawer shows live XML/JSON AST</text>
  <text x="58" y="796" fill="#334155" font-size="11.2">  diff + SHA-256 style checksums right inside Studio 2</text>
  <text x="58" y="814" fill="#334155" font-size="11.2">• 1-click Undo/Reset or clause-by-clause Accept/Reject</text>
