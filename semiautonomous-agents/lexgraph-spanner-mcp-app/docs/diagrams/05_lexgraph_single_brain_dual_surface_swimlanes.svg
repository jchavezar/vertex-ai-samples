  <text x="1058" y="740" fill="#065F46" font-size="13.5" font-weight="800">Zero-Corruption Export to iManage &amp; Opposing Counsel</text>
  <text x="1058" y="760" fill="#047857" font-size="11.2">• Downloads Format-Locked .docx (/api/redline/sample-docx)</text>
  <text x="1058" y="778" fill="#047857" font-size="11.2">• Counterparty (Skadden) runs Litera Compare against v4:</text>
  <text x="1058" y="796" fill="#065F46" font-size="11.2" font-weight="700">  -&gt; ONLY edited clauses show redlines (0 false page diffs)</text>
  <text x="1058" y="814" fill="#065F46" font-size="11.2" font-weight="700">  -&gt; 100% of custom styles, numbering &amp; footers preserved</text>
  <text x="1058" y="832" fill="#047857" font-size="11.2">• Auto-files signed version + CMN audit trail to iManage</text>
  <rect x="1058" y="860" width="444" height="24" rx="4" fill="#D1FAE5"/>
  <text x="1280" y="876" fill="#065F46" font-size="10" font-weight="700" text-anchor="middle">✓ Production-Ready for Sprint 3 Sandbox Deployment (Nov 2026)</text>

  <line x1="514" y1="795" x2="542" y2="795" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <line x1="1014" y1="795" x2="1042" y2="795" stroke="#D97706" stroke-width="2.5" marker-end="url(#arr-g)"/>
