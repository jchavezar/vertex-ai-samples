  <text x="58" y="278" fill="#1D4ED8" font-size="10.5" font-weight="700" font-family="monospace">• Zero M365 license or desktop app switch needed</text>
  <rect x="58" y="294" width="432" height="24" rx="4" fill="#DBEAFE"/>
  <text x="274" y="310" fill="#1E3A8A" font-size="10" font-weight="700" text-anchor="middle">Live on Cloud Run: lexgraph-redline-word-agent (GE Luminous v23.0.0)</text>

  <!-- Stage 1B: Surface 2 (Native Host Add-In) -->
  <rect x="534" y="156" width="460" height="176" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
