  <text x="676" y="181" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 1B · SURFACE 2 (20% HEAVY DRAFTING)</text>
  <text x="548" y="204" fill="#065F46" font-size="13.5" font-weight="800">Native Word Add-In (Office.js) &amp; Google Docs Add-On</text>
  <text x="548" y="224" fill="#047857" font-size="11.2">• Best for: Heavy manual keyboard drafting &amp; complex sub-lists</text>
  <text x="548" y="242" fill="#047857" font-size="11.2">• Loads the EXACT SAME Cloud Run UI in 380px Task Pane mode</text>
  <text x="548" y="259" fill="#047857" font-size="11.2">• Native Word / Google Docs handles 100% of keyboard layout</text>
  <text x="548" y="278" fill="#065F46" font-size="10.5" font-weight="700" font-family="monospace">• Zero custom ribbon/layout code to build or maintain</text>
  <rect x="548" y="294" width="432" height="24" rx="4" fill="#D1FAE5"/>
  <text x="764" y="310" fill="#065F46" font-size="10" font-weight="700" text-anchor="middle">40-Line manifest.xml Points Directly to Cloud Run URL</text>

  <!-- Stage 2: Spanner GraphRAG + Intapp Wall -->
  <rect x="1024" y="156" width="492" height="176" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
