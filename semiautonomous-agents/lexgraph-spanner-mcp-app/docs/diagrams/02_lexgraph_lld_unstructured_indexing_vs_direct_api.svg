<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" style="background:#F8FAFC;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="shadow2" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="24" y="20" width="1352" height="68" rx="10" fill="#0F172A"/>
  <text x="48" y="48" fill="#F8FAFC" font-size="20" font-weight="700">LOW-LEVEL DESIGN (LLD) — UNSTRUCTURED DOCUMENT INDEXING PIPELINE vs. DIRECT API EVALUATION</text>
  <text x="48" y="71" fill="#94A3B8" font-size="13" font-weight="500">Detailed Component Flow: Multimodal Parsing (PDF, .docx, Charts, Diagrams, Scans) -&gt; Spanner GraphRAG vs. Direct Runtime APIs for Email, Calendar &amp; Chat</text>

  <!-- LEFT PANEL (860px): UNSTRUCTURED MULTIMODAL INDEXING PIPELINE -->
  <rect x="24" y="104" width="870" height="692" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="24" y="104" width="870" height="34" rx="10" fill="#1E3A8A"/>
  <text x="44" y="126" fill="#FFFFFF" font-size="12.5" font-weight="800" letter-spacing="0.5">CRITICAL PATH A: UNSTRUCTURED MULTIMODAL DOCUMENT INDEXING PIPELINE (REQUIRED FOR GRID &amp; PIN-CITES)</text>

  <!-- Step 1: 4 Unstructured Modalities -->
  <text x="44" y="162" fill="#1E3A8A" font-size="13" font-weight="800">STEP 1 — Modality-Specific Deterministic + Vision-LLM Extraction (multimodal_extraction_pipeline.py)</text>

  <rect x="44" y="174" width="200" height="126" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="54" y="194" fill="#1E3A8A" font-size="12" font-weight="700">1. Executed PDFs (30+)</text>
  <text x="54" y="212" fill="#334155" font-size="10.5">• pypdfium2 page text &amp; layout</text>
  <text x="54" y="228" fill="#334155" font-size="10.5">• Regex section boundary tree:</text>
  <text x="54" y="243" fill="#475569" font-size="10" font-family="monospace">  ARTICLE I..XII / § 8.02(b)</text>
  <text x="54" y="259" fill="#334155" font-size="10.5">• Exact page_num &amp; bbox_json</text>
  <text x="54" y="275" fill="#1D4ED8" font-size="10" font-weight="700">  for yellow Pin-Cite drawer</text>

  <rect x="254" y="174" width="200" height="126" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="264" y="194" fill="#1E3A8A" font-size="12" font-weight="700">2. Word Contracts (.docx)</text>
  <text x="264" y="212" fill="#334155" font-size="10.5">• OpenXML w:p / w:numPr parser</text>
  <text x="264" y="228" fill="#334155" font-size="10.5">• Preserves 15-yr multi-level</text>
  <text x="264" y="243" fill="#334155" font-size="10.5">  legal numbering hierarchy</text>
  <text x="264" y="259" fill="#334155" font-size="10.5">• Word-level &lt;del&gt;/&lt;ins&gt; diff</text>
  <text x="264" y="275" fill="#1D4ED8" font-size="10" font-weight="700">  LexGraph v3 vs. Skadden v4</text>

  <rect x="464" y="174" width="200" height="126" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="474" y="194" fill="#1E3A8A" font-size="12" font-weight="700">3. Charts &amp; Waterfalls</text>
  <text x="474" y="212" fill="#334155" font-size="10.5">• 2-Pass docparse Extractor:</text>
  <text x="474" y="228" fill="#334155" font-size="10.5">  Pass 1: ChartSchemaOnly</text>
  <text x="474" y="243" fill="#334155" font-size="10.5">  Pass 2: ChartData series</text>
  <text x="474" y="259" fill="#334155" font-size="10.5">• Sum-to-Total Waterfall Audit</text>
  <text x="474" y="275" fill="#1D4ED8" font-size="10" font-weight="700">  ($145M+$18M+$12M=$175M)</text>

  <rect x="674" y="174" width="200" height="126" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="684" y="194" fill="#1E3A8A" font-size="12" font-weight="700">4. Org Diagrams &amp; Scans</text>
  <text x="684" y="212" fill="#334155" font-size="10.5">• DiagramData -&gt; Mermaid +</text>
  <text x="684" y="228" fill="#334155" font-size="10.5">  J.Crew IP Blocker boundary</text>
  <text x="684" y="243" fill="#334155" font-size="10.5">  (Restricted vs Unrestricted)</text>
  <text x="684" y="259" fill="#334155" font-size="10.5">• Wet-Ink Signature &amp; ABA/SWIFT</text>
  <text x="684" y="275" fill="#1D4ED8" font-size="10" font-weight="700">  Escrow Wire OCR ($18.0M)</text>

  <!-- Step 2: Normalization, Chunking & Dual Encoding -->
  <rect x="44" y="324" width="830" height="112" rx="8" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="60" y="346" fill="#1E3A8A" font-size="13" font-weight="800">STEP 2 — Atomic Clause Normalization, Metadata Binding &amp; 3072-Dim Vectorization</text>
  <text x="60" y="366" fill="#334155" font-size="11.5">• Atomic Clause Record: {clause_id, doc_id, matter_id (CMN), section_number, clause_title, page_number, bbox_json, clause_text, risk_level}</text>
  <text x="60" y="385" fill="#334155" font-size="11.5">• Dense Semantic Embedding: Vertex AI gemini-embedding-001 (output_dimensionality=3072, task_type="RETRIEVAL_DOCUMENT", L2 normalized)</text>
  <text x="60" y="404" fill="#334155" font-size="11.5">• Lexical Full-Text Tokenization: Cloud Spanner TOKENIZE_FULLTEXT(clause_text) -&gt; SEARCH INDEX ClauseFtsIndex (BM25 exact legal term match)</text>
  <text x="60" y="423" fill="#334155" font-size="11.5">• Cross-Matter Precedent Linker: Detects citations to prior LexGraph deals (M-215 Kestrel, M-518 Vanguard) -&gt; CitesPrecedent graph edges</text>

  <!-- Step 3: Cloud Spanner Storage & Screen-Before-Rank -->
  <rect x="44" y="460" width="830" height="148" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
  <text x="60" y="482" fill="#0F172A" font-size="13" font-weight="800">STEP 3 — Cloud Spanner Property Graph (LexGraphLegalGraph) &amp; Screen-Before-Rank Execution</text>
  <rect x="60" y="494" width="390" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="72" y="512" fill="#0F172A" font-size="11" font-weight="700" font-family="monospace">CREATE PROPERTY GRAPH LexGraphLegalGraph</text>
  <text x="72" y="530" fill="#334155" font-size="10.5" font-family="monospace">NODE TABLES (Matters, Documents, Clauses,</text>
  <text x="72" y="545" fill="#334155" font-size="10.5" font-family="monospace">             Lawyers, Clients, Emails)</text>
  <text x="72" y="562" fill="#334155" font-size="10.5" font-family="monospace">EDGE TABLES (BelongsToMatter, ContainsClause,</text>
  <text x="72" y="577" fill="#334155" font-size="10.5" font-family="monospace">             CitesPrecedent, IntappWalls,</text>
  <text x="72" y="591" fill="#334155" font-size="10.5" font-family="monospace">             TeammateGrants)</text>

  <rect x="466" y="494" width="392" height="100" rx="6" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="478" y="512" fill="#991B1B" font-size="11.5" font-weight="700">Screen-Before-Rank + 3-Way RRF Query Pipeline</text>
  <text x="478" y="530" fill="#7F1D1D" font-size="10.5">1. WHERE m.matter_id NOT IN (SELECT matter_id FROM</text>
  <text x="478" y="545" fill="#7F1D1D" font-size="10.5" font-family="monospace">   IntappWalls WHERE lawyer_id=@lawyer AND rule='DENY')</text>
  <text x="478" y="562" fill="#7F1D1D" font-size="10.5">2. Rank Leg 1: COSINE_DISTANCE(c.embedding, @q_vec)</text>
  <text x="478" y="577" fill="#7F1D1D" font-size="10.5">3. Rank Leg 2: SCORE_NGRAMS / SEARCH(c.clause_tokens)</text>
  <text x="478" y="591" fill="#7F1D1D" font-size="10.5">4. Fuse &amp; Return Top-K Clauses + Page/BBox Pin-Cites</text>

  <!-- Step 4: Consumer Studios -->
  <rect x="44" y="632" width="830" height="148" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#1E3A8A" font-size="13" font-weight="800">STEP 4 — How the Indexed Unstructured Graph Powers the Core MVP Journeys (CUJ-0 to CUJ-4)</text>
  <text x="60" y="675" fill="#1E40AF" font-size="11.5">• CUJ-0 (Cross-Matter Set Assembly): Queries Spanner Matters metadata -&gt; pulls qualifying Documents into Grid rows</text>
  <text x="60" y="694" fill="#1E40AF" font-size="11.5">• CUJ-1 &amp; CUJ-2 (Tabular Analysis Grid &amp; Validation): Parallel Gemini 3.8 Flash evaluates each column against indexed Clauses</text>
  <text x="60" y="713" fill="#1E40AF" font-size="11.5">• CUJ-3 (Red-Flag Diligence Memo): Synthesizes weighted M&amp;A memo from locked grid cells + CitesPrecedent clauses</text>
  <text x="60" y="732" fill="#1E40AF" font-size="11.5">• CUJ-4 (Side-by-Side Pin-Cite Verification): Uses page_number + bbox_json to highlight the exact source passage in &lt;15ms</text>
  <text x="60" y="751" fill="#1E40AF" font-size="11.5">• UC-1/2 (Redlining &amp; Legal Legos) &amp; UC-6 (FundGen/FundHQ/HSR): Benchmarks markups &amp; LP MFN tiers against Spanner precedent</text>

  <!-- RIGHT PANEL (466px): EMAIL, CALENDAR & CHAT EVALUATION (DIRECT API VS INDEX) -->
  <rect x="910" y="104" width="466" height="692" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="910" y="104" width="466" height="34" rx="10" fill="#92400E"/>
  <text x="930" y="126" fill="#FFFFFF" font-size="12.5" font-weight="800" letter-spacing="0.5">PATH B: EMAIL, CALENDAR &amp; CHAT (API vs. INDEX EVALUATION)</text>

  <text x="930" y="162" fill="#92400E" font-size="13" font-weight="800">Why We Evaluate Direct APIs Instead of Bulk Indexing</text>
  <text x="930" y="182" fill="#334155" font-size="11.5">Embedding ~150M emails, calendar invites, and chat threads into</text>
  <text x="930" y="198" fill="#334155" font-size="11.5">a vector database adds high cost, latency, and retention risk.</text>

  <!-- Channel 1: Email -->
  <rect x="930" y="216" width="426" height="172" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="946" y="238" fill="#92400E" font-size="13" font-weight="800">1. Email (M365 Exchange / Workspace BCP ~150M msgs)</text>
  <rect x="946" y="248" width="194" height="126" rx="6" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="956" y="266" fill="#059669" font-size="11" font-weight="800">Option A: Direct API (Live)</text>
  <text x="956" y="284" fill="#334155" font-size="10.5">• Call Exchange / Gmail MCP</text>
  <text x="956" y="299" fill="#334155" font-size="10.5">  API directly at runtime</text>
  <text x="956" y="314" fill="#334155" font-size="10.5">• Best for: Daily partner inbox</text>
  <text x="956" y="329" fill="#334155" font-size="10.5">  triage, unread threads, &amp;</text>
  <text x="956" y="344" fill="#334155" font-size="10.5">  reply drafting (UC-4)</text>
  <text x="956" y="362" fill="#059669" font-size="10" font-weight="700">✓ Zero indexing wait/cost</text>

  <rect x="1150" y="248" width="194" height="126" rx="6" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="1160" y="266" fill="#2563EB" font-size="11" font-weight="800">Option B: Envelope Graph</text>
  <text x="1160" y="284" fill="#334155" font-size="10.5">• Graph ONLY metadata in</text>
  <text x="1160" y="299" fill="#334155" font-size="10.5">  Spanner (Sender, Recipient,</text>
  <text x="1160" y="314" fill="#334155" font-size="10.5">  CMN, Attachment pointer)</text>
  <text x="1160" y="329" fill="#334155" font-size="10.5">• Only deal attachments enter</text>
  <text x="1160" y="344" fill="#334155" font-size="10.5">  Path A Unstructured Pipeline</text>
  <text x="1160" y="362" fill="#2563EB" font-size="10" font-weight="700">✓ No 150M vector embedding</text>

  <!-- Channel 2: Calendar -->
  <rect x="930" y="404" width="426" height="142" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="946" y="426" fill="#065F46" font-size="13" font-weight="800">2. Calendar &amp; Scheduling (Outlook / Google Calendar)</text>
  <text x="946" y="446" fill="#047857" font-size="11.5" font-weight="700">Recommendation: 100% Direct Runtime API (No Indexing)</text>
  <text x="946" y="466" fill="#334155" font-size="11">• Query live freeBusy / VEVENT endpoints at runtime when checking</text>
  <text x="946" y="482" fill="#334155" font-size="11">  partner deal closing calls vs. regulatory hearings (e.g. CAL-101)</text>
  <text x="946" y="500" fill="#334155" font-size="11">• Executes 1-tap conflict delegation &amp; rescheduling via API</text>
  <text x="946" y="518" fill="#059669" font-size="11" font-weight="700">• Sub-100ms live accuracy; zero reason to index ephemeral events</text>

  <!-- Channel 3: Chat -->
  <rect x="930" y="562" width="426" height="132" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="946" y="584" fill="#0F172A" font-size="13" font-weight="800">3. Enterprise Chat (Google Chat / Teams Spaces)</text>
  <text x="946" y="604" fill="#334155" font-size="11.5" font-weight="700">Recommendation: Direct MCP API + Explicit Matter Pinning</text>
  <text x="946" y="624" fill="#334155" font-size="11">• Use federated Chat MCP tools (list_messages / search_messages)</text>
  <text x="946" y="640" fill="#334155" font-size="11">  on demand rather than bulk-ingesting chat logs into Spanner</text>
  <text x="946" y="658" fill="#334155" font-size="11">• Preserves court-ordered mid-matter deletion &amp; OCG compliance</text>

  <!-- Summary Takeaway Box -->
  <rect x="930" y="710" width="426" height="70" rx="8" fill="#0F172A"/>
  <text x="946" y="732" fill="#F8FAFC" font-size="12" font-weight="700">KEY ARCHITECTURAL TAKEAWAY FOR MVP TIMELINE:</text>
  <text x="946" y="750" fill="#38BDF8" font-size="11">Unstructured Docs = Index into Spanner GraphRAG (Critical Path)</text>
  <text x="946" y="766" fill="#FCD34D" font-size="11">Email / Calendar / Chat = Direct Runtime API (Does Not Block MVP)</text>
</svg>