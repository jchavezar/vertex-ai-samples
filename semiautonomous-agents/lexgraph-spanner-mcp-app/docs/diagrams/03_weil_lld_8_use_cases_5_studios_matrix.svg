  <text x="44" y="150" fill="#0F172A" font-size="11.5" font-weight="700">1. Discovery &amp; Tool Call:</text>
  <text x="195" y="150" fill="#334155" font-size="11.5">Each custom_mcp DataStore exposes 1 readOnlyHint:true primary tool -&gt; returns _meta.ui.resourceUri (ui://mike-gcp/*.html)</text>
  <text x="44" y="170" fill="#0F172A" font-size="11.5" font-weight="700">2. Sandboxed srcdoc SSR:</text>
  <text x="195" y="170" fill="#334155" font-size="11.5">Pre-renders initial table rows in &lt;tbody&gt; + embeds INITIAL_BOOTSTRAP_DATA + routes live fetches via absolute Cloud Run API_BASE</text>
  <text x="44" y="190" fill="#0F172A" font-size="11.5" font-weight="700">3. Bidirectional Bridge:</text>
  <text x="195" y="190" fill="#334155" font-size="11.5">Sends ui/initialize, ui/notifications/size-changed (760px), and ui/request-display-mode (mode:"pip") to dock in GE Side Panel or 1440px Max</text>

