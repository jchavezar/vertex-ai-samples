  <text x="560" y="188" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">2A</text>
  <text x="584" y="182" fill="#174EA6" font-size="14.5" font-weight="800">BigQuery ML AI.FORECAST Syntax</text>
  <text x="584" y="200" fill="#1A73E8" font-size="10" font-family="monospace">CREATE OR REPLACE MODEL ... OPTIONS(model_type='TIMESFM')</text>
  
  <!-- SQL Box -->
  <rect x="550" y="215" width="480" height="225" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="565" y="238" fill="#38BDF8" font-size="10.5" font-family="monospace">SELECT</text>
  <text x="580" y="256" fill="#F8FAFC" font-size="10.5" font-family="monospace">  forecast_timestamp,</text>
  <text x="580" y="274" fill="#F8FAFC" font-size="10.5" font-family="monospace">  forecast_value AS predicted_cpr,</text>
  <text x="580" y="292" fill="#F8FAFC" font-size="10.5" font-family="monospace">  confidence_interval_lower_bound AS cpr_p05,</text>
  <text x="580" y="310" fill="#F8FAFC" font-size="10.5" font-family="monospace">  confidence_interval_upper_bound AS cpr_p95</text>
  <text x="565" y="328" fill="#38BDF8" font-size="10.5" font-family="monospace">FROM ML.FORECAST(</text>
  <text x="580" y="346" fill="#E2E8F0" font-size="10.5" font-family="monospace">  MODEL `rocket_servicing.timesfm_2_0_engine`,</text>
  <text x="580" y="364" fill="#E2E8F0" font-size="10.5" font-family="monospace">  STRUCT(24 AS horizon, 0.95 AS confidence_level),</text>
  <text x="580" y="382" fill="#E2E8F0" font-size="10.5" font-family="monospace">  (SELECT * FROM `macro_covariates_shocked`)</text>
  <text x="565" y="400" fill="#38BDF8" font-size="10.5" font-family="monospace">)</text>
  <text x="565" y="425" fill="#4ADE80" font-size="10" font-family="monospace">-- Latency: 1,840ms across 9.5M loans with TPU v5e inference</text>

  <!-- Arrow 2A -> 2B -->
