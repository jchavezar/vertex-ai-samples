  <circle cx="560" cy="524" r="14" fill="#0F172A"/>
  <text x="560" y="528" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">2B</text>
  <text x="584" y="522" fill="#0F172A" font-size="14.5" font-weight="800">TimesFM 2.0 Architectural Foundations</text>
  <text x="584" y="540" fill="#64748B" font-size="10" font-family="monospace">Google Research Foundation Time-Series Model</text>
  <text x="550" y="565" fill="#1E293B" font-size="11">• 500M Parameter Patch-Based Transformer Decoder</text>
  <text x="550" y="585" fill="#1E293B" font-size="11">• Input Patch Length: 32 time-steps · Output Patch Length: 128 steps</text>
  <text x="550" y="605" fill="#1E293B" font-size="11">• Pretrained on 100 Billion Real-World Time Points (Finance, Weather, Energy)</text>
  <text x="550" y="625" fill="#1E293B" font-size="11">• Native handling of non-stationary mortgage velocity &amp; seasonality</text>
  
  <rect x="550" y="640" width="480" height="195" rx="6" fill="#EFF6FF" stroke="#1A73E8"/>
  <text x="565" y="662" fill="#174EA6" font-size="11.5" font-weight="700">Prepayment S-Curve Dynamics Modeled Zero-Shot:</text>
  <text x="565" y="684" fill="#1E293B" font-size="10.5">• Media Turnover Band (Baseline moves 6-8% CPR)</text>
  <text x="565" y="702" fill="#1E293B" font-size="10.5">• Refinance Incentive Surge (Rates drop &gt;50bps → CPR jumps to 28-34%)</text>
  <text x="565" y="720" fill="#1E293B" font-size="10.5">• Burnout Factor (Remaining borrowers demonstrate lower responsiveness)</text>
  <text x="565" y="738" fill="#1E293B" font-size="10.5">• Lock-in Effect (Borrowers with &lt;3.5% coupon hold through rate hikes)</text>
  <text x="565" y="760" fill="#188038" font-size="11" font-weight="700">✓ TimesFM outperforms legacy ARIMA/Prophet by 42% on RMSE</text>
  <text x="565" y="778" fill="#188038" font-size="10.5">  and eliminates weeks of manual feature engineering and hyperparameter tuning</text>
  <text x="565" y="798" fill="#1A73E8" font-size="10" font-family="monospace">Artifact: gs://vtxdemos-timesfm/models/servicing_v2/</text>

