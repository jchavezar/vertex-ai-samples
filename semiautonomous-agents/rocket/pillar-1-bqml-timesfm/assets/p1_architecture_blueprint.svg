  <text x="36" y="133" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.5">PHASE 1 — 9.5M SERVICING PORTFOLIO INGESTION</text>

  <rect x="36" y="160" width="448" height="200" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="60" cy="184" r="14" fill="#0F172A"/>
  <text x="60" y="188" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">1A</text>
  <text x="84" y="182" fill="#0F172A" font-size="14" font-weight="800">Servicing Loan Tape Aggregation</text>
  <text x="84" y="200" fill="#64748B" font-size="10" font-family="monospace">bigquery.rocket_cooper_servicing.portfolio_metrics</text>
  <text x="50" y="224" fill="#1E293B" font-size="11">• 9.5M Active Agency (Fannie/Freddie/Ginnie) &amp; Non-QM Mortgages</text>
  <text x="50" y="244" fill="#1E293B" font-size="11">• Tracked Attributes: Current UPB ($2.1T total), WAC (Weighted Avg Coupon)</text>
  <text x="50" y="264" fill="#1E293B" font-size="11">• Historical CPR (Conditional Prepayment Rate) &amp; CDR (Default Rate)</text>
  <text x="50" y="284" fill="#1E293B" font-size="11">• Monthly delinquency transitions (30/60/90/FC) over 84 months</text>
  <rect x="50" y="304" width="420" height="36" rx="4" fill="#E2E8F0"/>
  <text x="62" y="326" fill="#0F172A" font-size="10.5" font-family="monospace">SELECT loan_id, as_of_date, upb, wac, cpr_1m, cdr_1m FROM ...</text>

  <!-- Arrow 1A -> 1B -->
  <line x1="260" y1="360" x2="260" y2="395" stroke="#1A73E8" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <rect x="36" y="400" width="448" height="220" rx="8" fill="#EFF6FF" stroke="#1A73E8" stroke-width="2" filter="url(#card-shadow)"/>
  <circle cx="60" cy="424" r="14" fill="#1A73E8"/>
  <text x="60" y="428" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">1B</text>
  <text x="84" y="422" fill="#174EA6" font-size="14" font-weight="800">Macro Covariate Scaler &amp; Rate-Shock Matrix</text>
  <text x="84" y="440" fill="#1A73E8" font-size="10" font-family="monospace">pillar-1-bqml-timesfm/engine.py · CovariateEngine</text>
  <text x="50" y="464" fill="#1E293B" font-size="11">• Dynamic Rate-Shock Injection: -150 bps to +100 bps</text>
  <text x="50" y="484" fill="#1E293B" font-size="11">• Macroeconomic External Series Alignment:</text>
  <text x="65" y="504" fill="#334155" font-size="10.5">- 10-Year Treasury Yield (DGS10) &amp; 30-Year Fixed Mortgage Rate</text>
  <text x="65" y="522" fill="#334155" font-size="10.5">- CPI Headline &amp; Core Inflation (BLS Fed series)</text>
  <text x="65" y="540" fill="#334155" font-size="10.5">- Regional FHFA Home Price Index (HPI) projections</text>
  <rect x="50" y="556" width="420" height="45" rx="4" fill="#DBEAFE"/>
  <text x="62" y="575" fill="#1E40AF" font-size="10" font-weight="700">Covariate Matrix: [date, rate_shock_delta, dgs10, mortgage30, cpi]</text>
  <text x="62" y="591" fill="#1E40AF" font-size="10">Aligned in BigQuery via STRUCT ARRAY for zero-copy TimesFM passing</text>

  <rect x="36" y="640" width="448" height="215" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="60" cy="664" r="14" fill="#0F172A"/>
  <text x="60" y="668" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">1C</text>
  <text x="84" y="662" fill="#0F172A" font-size="14" font-weight="800">Partitioned In-Memory Serving Cache</text>
  <text x="84" y="680" fill="#64748B" font-size="10" font-family="monospace">BigQuery BI Engine &amp; Storage Read API</text>
  <text x="50" y="704" fill="#1E293B" font-size="11">• 100GB In-Memory BI Engine Reservation for instantaneous slicing</text>
  <text x="50" y="724" fill="#1E293B" font-size="11">• Partitioned by cohort_vintage_year, Clustered by fannie_tier</text>
  <text x="50" y="744" fill="#1E293B" font-size="11">• Zero network shuffle to ML runtime</text>
