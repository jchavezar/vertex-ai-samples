  <text x="96" y="47" fill="#202124" font-size="20" font-weight="800" letter-spacing="-0.3">Pillar 1 Reference Architecture — BigQuery ML TimesFM 2.0 Servicing Portfolio Forecasting</text>
  <text x="96" y="70" fill="#5F6368" font-size="12" font-weight="500">Zero-Shot Foundation Time-Series Engine · 9.5M Combined Mr. Cooper + Rocket Mortgages · Rate-Shock Covariates (-150 to +100 bps) · MSR Valuation</text>

  <rect x="1190" y="26" width="180" height="24" rx="12" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="1280" y="42" fill="#1967D2" font-size="10.5" font-weight="700" text-anchor="middle">BigQuery ML AI.FORECAST</text>
  <rect x="1384" y="26" width="180" height="24" rx="12" fill="#E6F4EA" stroke="#188038"/>
  <text x="1474" y="42" fill="#137333" font-size="10.5" font-weight="700" text-anchor="middle">TimesFM 2.0 Foundation</text>
  <text x="1368" y="73" fill="#5F6368" font-size="11" font-weight="600" text-anchor="middle">In-Memory Execution: 1,840ms Latency</text>

