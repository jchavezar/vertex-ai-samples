<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" style="background:#F8FAFC;font-family:'Google Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="gcp-shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-1%" y="-1%" width="102%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1A73E8"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect width="1600" height="1040" fill="#F8FAFC"/>
  <rect width="1600" height="1040" fill="url(#grid)"/>

  <!-- HEADER -->
  <rect x="20" y="16" width="1560" height="80" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#gcp-shadow)"/>
  <rect x="20" y="16" width="8" height="80" rx="4" fill="#7C3AED"/>

  <g transform="translate(46, 36)">
    <path d="M22.8 11.2l3.4-3.4c-.2-.2-.5-.4-.7-.6-2.2-1.6-4.9-2.5-7.8-2.5-5.6 0-10.4 3.5-12.3 8.5l4.2 3.1c1.1-3.3 4.3-5.7 8.1-5.7 1.9 0 3.7.7 5.1 1.6z" fill="#EA4335"/>
    <path d="M30.4 15.6c-.8-3.1-2.6-5.8-5.1-7.7l-3.4 3.4c1.7 1.3 2.9 3.2 3.3 5.4v.5c2.4 0 4.3 1.9 4.3 4.3s-1.9 4.3-4.3 4.3h-8.5v5.8h8.5c5.6 0 10.1-4.5 10.1-10.1 0-2.3-.8-4.3-1.9-5.9z" fill="#4285F4"/>
    <path d="M8.2 31.6h8.5v-5.8H8.2c-2.4 0-4.3-1.9-4.3-4.3 0-1.8 1.1-3.3 2.7-4l-4.2-3.1C.9 16.2 0 18.7 0 21.5c0 5.6 4.5 10.1 8.2 10.1z" fill="#FBBC04"/>
    <path d="M16.7 31.6c2.8 0 5.4-1.1 7.3-2.9l-4.1-4.1c-.9.7-2 1.2-3.2 1.2-3.1 0-5.8-2.1-6.7-5l-4.2 3.1c1.9 4.5 6.1 7.7 10.9 7.7z" fill="#34A853"/>
  </g>

  <text x="96" y="47" fill="#202124" font-size="20" font-weight="800" letter-spacing="-0.3">Pillar 4 Reference Architecture — Gemini 3.8 Live Avatar Stage &amp; Async Subagents</text>
  <text x="96" y="70" fill="#5F6368" font-size="12" font-weight="500">Continuous 704x1280 24fps fMP4 Remuxing · Server VAD &amp; 40ms Barge-In · Init Segment Caching · Out-of-Order Subagent Swarm · Omni Screen Control</text>

  <rect x="1190" y="26" width="180" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="1280" y="42" fill="#6D28D9" font-size="10.5" font-weight="700" text-anchor="middle">Gemini 3.8 Live API</text>
  <rect x="1384" y="26" width="180" height="24" rx="12" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="1474" y="42" fill="#1967D2" font-size="10.5" font-weight="700" text-anchor="middle">Continuous fMP4 + MSE</text>
  <text x="1368" y="73" fill="#5F6368" font-size="11" font-weight="600" text-anchor="middle">Native Barge-In: &lt; 40ms Latency</text>

  <!-- COLUMN 1: CLIENT RUNTIME &amp; AUDIO STREAMING (x=20, w=480) -->
  <rect x="20" y="110" width="480" height="770" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#gcp-shadow)"/>
  <rect x="20" y="110" width="480" height="36" rx="10" fill="#7C3AED"/>
  <text x="36" y="133" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.5">PHASE 1 — CLIENT AUDIO / VIDEO SINK &amp; STAGE</text>

  <rect x="36" y="160" width="448" height="220" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="60" cy="184" r="14" fill="#7C3AED"/>
  <text x="60" y="188" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">1A</text>
  <text x="84" y="182" fill="#6D28D9" font-size="14" font-weight="800">RocketLive Engine &amp; Mic Capture</text>
  <text x="84" y="200" fill="#7C3AED" font-size="10" font-family="monospace">static/live_session.js · window.RocketLive.start()</text>
  <text x="50" y="224" fill="#1E293B" font-size="11">• AudioContext capture: 16 kHz Mono PCM16 over WebSocket</text>
  <text x="50" y="244" fill="#1E293B" font-size="11">• Replaced legacy webkitSpeechRecognition with native full-duplex audio</text>
  <text x="50" y="264" fill="#1E293B" font-size="11">• Binary WS payload: {"type": "audio", "pcm16_b64": "..."}</text>
  <text x="50" y="284" fill="#1E293B" font-size="11">• Automatic Reconnect &amp; State Diffing (connecting / live / idle / speaking)</text>
  <rect x="50" y="304" width="420" height="60" rx="4" fill="#EDE9FE"/>
  <text x="62" y="324" fill="#5B21B6" font-size="10" font-weight="700">Official Video Avatar Profiles:</text>
  <text x="62" y="342" fill="#5B21B6" font-size="9.5">Kira (Underwriter) · Sam (Mortgage Advisor) · Ben (Broker) · Vera (Closing Officer)</text>
  <text x="62" y="356" fill="#5B21B6" font-size="9">Native 704x1280 portrait video stream direct from Gemini Live Engine</text>

  <!-- Arrow 1A -> 1B -->
  <line x1="260" y1="380" x2="260" y2="415" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <rect x="36" y="420" width="448" height="210" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="60" cy="444" r="14" fill="#0F172A"/>
  <text x="60" y="448" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">1B</text>
  <text x="84" y="442" fill="#0F172A" font-size="14" font-weight="800">MediaSource Extensions (MSE) VideoSink</text>
  <text x="84" y="460" fill="#64748B" font-size="10" font-family="monospace">SourceBuffer.appendBuffer · video/mp4; codecs="avc1.64001f, mp4a.40.2"</text>
  <text x="50" y="484" fill="#1E293B" font-size="11">• 4:5 Portrait Live Stage with zero-gap loop playback</text>
  <text x="50" y="504" fill="#1E293B" font-size="11">• Seamless Crossfade between crisp idle poster and live video frames</text>
  <text x="50" y="524" fill="#1E293B" font-size="11">• Critical Bug Fix: VideoSink.close() detaches only if v.src matches own blob</text>
  <text x="50" y="540" fill="#1E293B" font-size="11">  preventing InvalidStateError and frozen avatar on rapid profile switch</text>
  <rect x="50" y="555" width="420" height="60" rx="4" fill="#E2E8F0"/>
  <text x="62" y="575" fill="#0F172A" font-size="10" font-weight="700">Audio-Driven Speaking Detection:</text>
  <text x="62" y="591" fill="#334155" font-size="9.5">WebAudio AnalyserNode on video.captureStream() measures true vocal decibels;</text>
  <text x="62" y="605" fill="#334155" font-size="9">avoids false speaking state during silent video idle fragments</text>

  <rect x="36" y="640" width="448" height="215" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="60" cy="664" r="14" fill="#7C3AED"/>
  <text x="60" y="668" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">1C</text>
  <text x="84" y="662" fill="#6D28D9" font-size="14" font-weight="800">Dynamic Stage &amp; Chat Transcript</text>
  <text x="84" y="680" fill="#7C3AED" font-size="10" font-family="monospace">static/p4_stage.js · CSS Grid contain:size</text>
  <text x="50" y="704" fill="#1E293B" font-size="11">• Real-Time Bidirectional Transcript with turn speaker badges</text>
  <text x="50" y="724" fill="#1E293B" font-size="11">• contain: size prevents expanding chat panel from stretching stage grid</text>
  <text x="50" y="744" fill="#1E293B" font-size="11">• Legacy Shim: Hidden #p4-legacy-shim preserves legacy DOM nodes</text>
  <rect x="50" y="760" width="420" height="75" rx="4" fill="#0F172A"/>
  <text x="62" y="780" fill="#38BDF8" font-size="10" font-family="monospace"># Live WS Connection Badge</text>
  <text x="62" y="798" fill="#4ADE80" font-size="10" font-family="monospace">Status: CONNECTED · Protocol: Gemini Live v1beta</text>
  <text x="62" y="816" fill="#F8FAFC" font-size="10" font-family="monospace">Bitrate: 850 kbps continuous video + 32 kbps audio</text>

  <!-- COLUMN 2: SERVER BACKEND &amp; CONTINUOUS REMUXER (x=520, w=540) -->
  <rect x="520" y="110" width="540" height="770" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" filter="url(#gcp-shadow)"/>
  <rect x="520" y="110" width="540" height="36" rx="10" fill="#7C3AED"/>
  <text x="536" y="133" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.5">PHASE 2 — CONTINUOUS fMP4 &amp; VAD ENGINE</text>

  <!-- Routing from 1A -> 2A -->
  <line x1="484" y1="270" x2="520" y2="250" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <rect x="536" y="160" width="508" height="320" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="560" cy="184" r="14" fill="#7C3AED"/>
  <text x="560" y="188" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">2A</text>
  <text x="584" y="182" fill="#6D28D9" font-size="14.5" font-weight="800">Gemini 3.8 Live WebSocket Bridge</text>
  <text x="584" y="200" fill="#7C3AED" font-size="10" font-family="monospace">pillar-4-live-api-avatar/engine.py · Bidi WebSocket</text>
  
  <!-- Python Code Box -->
  <rect x="550" y="215" width="480" height="250" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="565" y="238" fill="#38BDF8" font-size="10.5" font-family="monospace">async with client.aio.live.connect(</text>
  <text x="580" y="256" fill="#F8FAFC" font-size="10.5" font-family="monospace">    model="gemini-3.8-live", config=types.LiveConnectConfig(</text>
  <text x="595" y="274" fill="#E2E8F0" font-size="10.5" font-family="monospace">        response_modalities=["AUDIO", "VIDEO"],</text>
  <text x="595" y="292" fill="#E2E8F0" font-size="10.5" font-family="monospace">        speech_config=types.SpeechConfig(voice_name=voice),</text>
  <text x="595" y="310" fill="#E2E8F0" font-size="10.5" font-family="monospace">        avatar_config=types.AvatarConfig(preset_avatar=avatar),</text>
  <text x="595" y="328" fill="#E2E8F0" font-size="10.5" font-family="monospace">        realtime_input_config=types.RealtimeInputConfig(</text>
  <text x="610" y="346" fill="#F8FAFC" font-size="10.5" font-family="monospace">            activity_handling="START_OF_ACTIVITY_INTERRUPTS",</text>
  <text x="610" y="364" fill="#F8FAFC" font-size="10.5" font-family="monospace">            automatic_activity_detection=types.AutomaticActivityDetection(</text>
  <text x="625" y="382" fill="#E2E8F0" font-size="10.5" font-family="monospace">                start_of_speech_sensitivity="START_SENSITIVITY_LOW",</text>
  <text x="625" y="400" fill="#E2E8F0" font-size="10.5" font-family="monospace">                silence_duration_ms=600</text>
  <text x="610" y="418" fill="#F8FAFC" font-size="10.5" font-family="monospace">            )</text>
  <text x="595" y="436" fill="#E2E8F0" font-size="10.5" font-family="monospace">        )</text>
  <text x="580" y="454" fill="#F8FAFC" font-size="10.5" font-family="monospace">    )</text>
  <text x="565" y="470" fill="#38BDF8" font-size="10.5" font-family="monospace">) as session:</text>

  <!-- Arrow 2A -> 2B -->
  <line x1="770" y1="480" x2="770" y2="505" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <rect x="536" y="510" width="508" height="345" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="560" cy="534" r="14" fill="#0F172A"/>
  <text x="560" y="538" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">2B</text>
  <text x="584" y="532" fill="#0F172A" font-size="14.5" font-weight="800">fMP4 Init Segment Cache &amp; Remuxer</text>
  <text x="584" y="550" fill="#64748B" font-size="10" font-family="monospace">Persistent FFmpeg Remuxing across Turns &amp; Interrupts</text>
  <text x="550" y="575" fill="#1E293B" font-size="11">• Core Challenge: gemini-3.8-live emits ONE continuous fragmented MP4.</text>
  <text x="550" y="591" fill="#1E293B" font-size="11">  Only chunk #1 contains 'ftyp' + 'moov'; subsequent chunks are 'moof'+'mdat'</text>
  <text x="550" y="611" fill="#1E293B" font-size="11">• Solution: Engine intercepts chunk #1, caches the 8KB Init Segment,</text>
  <text x="550" y="627" fill="#1E293B" font-size="11">  and maintains a single persistent FFmpeg pipe across all conversational turns</text>
  <text x="550" y="647" fill="#1E293B" font-size="11">• 40ms Barge-In / Interrupt Handling:</text>
  <text x="565" y="667" fill="#334155" font-size="10.5">- On user speech onset, send_client_content(turn_complete=True) cancels generation</text>
  <text x="565" y="685" fill="#334155" font-size="10.5">- Remuxer restarts instantly with cached 'ftyp'+'moov' prepended</text>
  <text x="565" y="703" fill="#334155" font-size="10.5">- Zero frame stutter or video tear in the browser</text>

  <rect x="550" y="720" width="480" height="120" rx="6" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="565" y="742" fill="#6D28D9" font-size="11.5" font-weight="700">Server VAD Performance Metrics:</text>
  <text x="565" y="762" fill="#1E293B" font-size="10.5">• Speech Start Detection: ~350ms after vocal onset</text>
  <text x="565" y="780" fill="#1E293B" font-size="10.5">• Server-Side Interrupt Cancellation: 40ms round-trip</text>
  <text x="565" y="798" fill="#188038" font-size="11" font-weight="700">✓ Video Frame Continuity: 24.0 fps zero dropped frames</text>
  <text x="565" y="816" fill="#188038" font-size="10.5">  Eliminates legacy MSE "appendBuffer failed InvalidStateError"</text>

  <!-- COLUMN 3: SUBAGENT SWARM &amp; SCREEN CONTROL (x=1080, w=500) -->
  <rect x="1080" y="110" width="500" height="770" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#gcp-shadow)"/>
  <rect x="1080" y="110" width="500" height="36" rx="10" fill="#7C3AED"/>
  <text x="1096" y="133" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.5">PHASE 3 — ASYNC SWARM &amp; OMNI CONTROL</text>

  <!-- Routing 2A -> 3A -->
  <line x1="1044" y1="280" x2="1080" y2="220" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <rect x="1096" y="160" width="468" height="280" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="1120" cy="184" r="14" fill="#7C3AED"/>
  <text x="1120" y="188" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">3A</text>
  <text x="1144" y="182" fill="#6D28D9" font-size="14.5" font-weight="800">Asyncio Subagent Swarm (Out-of-Order)</text>
  <text x="1144" y="200" fill="#7C3AED" font-size="10" font-family="monospace">gemini-3.1-flash-lite · asyncio.as_completed</text>
  
  <text x="1110" y="225" fill="#1E293B" font-size="11">• Specialized Micro-Agents Dispatched Concurrently:</text>
  <text x="1125" y="245" fill="#334155" font-size="10.5">1. DTI &amp; Debt Calculator: Computes back-end ratios in 120ms</text>
  <text x="1125" y="263" fill="#334155" font-size="10.5">2. Amortization Scheduler: Computes 360-month principal schedule</text>
  <text x="1125" y="281" fill="#334155" font-size="10.5">3. Freddie/Fannie Guideline Checker: LTV/FICO compliance audit</text>
  <text x="1125" y="299" fill="#334155" font-size="10.5">4. Property Tax &amp; Insurance Estimator: County parcel query</text>
  <text x="1110" y="321" fill="#1E293B" font-size="11">• First-Ready Streaming: Renders results immediately as each subagent completes</text>
  
  <rect x="1110" y="340" width="440" height="85" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="1125" y="362" fill="#5B21B6" font-size="11" font-weight="700">Parallel Speedup vs Serial Processing:</text>
  <text x="1125" y="382" fill="#1E293B" font-size="10">• Serial Execution: 4 subagents × 1.2s = 4.8s delay</text>
  <text x="1125" y="400" fill="#188038" font-size="10.5" font-weight="700">• Concurrent as_completed: Complete dossier rendered in 1.14s (4.2x faster)</text>

  <!-- Arrow 3A -> 3B -->
  <line x1="1330" y1="440" x2="1330" y2="475" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <rect x="1096" y="480" width="468" height="375" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="1120" cy="504" r="14" fill="#0F172A"/>
  <text x="1120" y="508" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">3B</text>
  <text x="1144" y="502" fill="#0F172A" font-size="14.5" font-weight="800">Omni Screen Control &amp; Function Calling</text>
  <text x="1144" y="520" fill="#64748B" font-size="10" font-family="monospace">Tool Call: control_realestate_marketplace</text>
  
  <text x="1110" y="545" fill="#1E293B" font-size="11">• Model spontaneously issues function calls while speaking to borrower</text>
  <text x="1110" y="565" fill="#1E293B" font-size="11">• Screen Synchronization Protocol:</text>
  <text x="1125" y="585" fill="#334155" font-size="10.5">{"name": "filter_properties", "args": {"beds": 4, "max_price": 850000}}</text>
  <text x="1125" y="603" fill="#334155" font-size="10.5">{"name": "switch_tab", "args": {"pillar": 5, "view": "marketplace"}}</text>
  <text x="1125" y="621" fill="#334155" font-size="10.5">{"name": "highlight_listing", "args": {"listing_id": "RKT-098"}}</text>

  <rect x="1110" y="640" width="440" height="195" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="1125" y="662" fill="#0F172A" font-size="11.5" font-weight="700">Autonomous Advisor Telemetry:</text>
  <text x="1125" y="684" fill="#1E293B" font-size="10.5">• Tool Call Dispatch Latency: 48ms from spoken phrase</text>
  <text x="1125" y="702" fill="#1E293B" font-size="10.5">• Simultaneous Voice &amp; Screen Action: Avatar describes house while UI navigates</text>
  <text x="1125" y="720" fill="#6D28D9" font-size="10.5" font-weight="700">• Zero Disconnect: Single WebSocket manages both audio/video and tool events</text>
  <text x="1125" y="738" fill="#1E293B" font-size="10.5">• Fallback Mode: Seamless downgrade to 2D sprite canvas if WebGL unavailable</text>
  <rect x="1125" y="755" width="410" height="65" rx="4" fill="#7C3AED"/>
  <text x="1330" y="778" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">FIRST-IN-CLASS ENTERPRISE LIVE AVATAR</text>
  <text x="1330" y="796" fill="#EDE9FE" font-size="9.5" text-anchor="middle">Combines high-fidelity facial synthesis with real financial underwriting</text>
  <text x="1330" y="810" fill="#FFFFFF" font-size="9" text-anchor="middle">Full compliance with Mortgage Disclosure Improvement Act (MDIA)</text>

  <!-- ==================== FOOTER ==================== -->
  <rect x="20" y="895" width="1560" height="125" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" filter="url(#gcp-shadow)"/>
  <text x="40" y="922" fill="#38BDF8" font-size="12" font-weight="800" letter-spacing="0.5">PILLAR 4 SUMMARY &amp; INTEGRATION SPECIFICATION</text>
  
  <rect x="40" y="935" width="1520" height="70" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="56" y="955" fill="#F8FAFC" font-size="11" font-weight="700">Live Stage Pipeline: Browser 16kHz PCM16 → WebSocket /ws/live-avatar → gemini-3.8-live (us-central1) → Persistent FFmpeg → MSE VideoSink</text>
  <text x="56" y="973" fill="#94A3B8" font-size="10.5">• Continuous fMP4: Cached 'ftyp'+'moov' Init Segment enables instant mid-stream remuxer restarts on 40ms native barge-in interrupts</text>
  <text x="56" y="991" fill="#4ADE80" font-size="10.5" font-weight="700">✓ Parallel Swarm: asyncio.as_completed with gemini-3.1-flash-lite provides instant sub-1.2s loan scenario calculations</text>

</svg>